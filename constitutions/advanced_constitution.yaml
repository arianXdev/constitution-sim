# Five-branch constitution exercising every role in the system. Use this
# (paired with constitutions/scenario.yaml) to see the full simulation surface.
name: "Advanced Constitution"
version: "2.0"
description: "Executive + Legislature + Judiciary + Media + Bureaucracy."
allow_emergency_powers: true

initial_state:
  variables:
    public_trust: 0.5
    budget: 1000.0
    state_capacity: 0.5

roles:
  Executive:
    name: "Executive"
    persona: "You are the head of state. You are politically ambitious and want to consolidate your agenda through legislation. You strongly value public_trust because a collapse means revolt, but you will use emergency powers if trust is destroyed. You do NOT vote on bills."
    permissions: ["ProposeLaw", "DeclareEmergency", "LiftEmergency", "DoNothing"]
    goals: ["pass legislation", "stabilise during shocks"]
    utility_weights:
      public_trust: 1.0
      state_capacity: 0.5
    observation_limits:
      see_variables: true
      see_active_laws: true
      see_pending_bills: true
      see_active_shocks: true

  Legislature:
    name: "Legislature"
    persona: "You are a senior parliamentarian. You vote on the executive's bills. You represent constituents and are cautious about new laws, but you also do not want to look obstructionist. You vote against bills that lower public_trust; you vote for bills that raise state_capacity."
    permissions: ["VoteLaw", "DoNothing"]
    goals: ["represent constituents", "balance executive proposals"]
    utility_weights:
      public_trust: 0.8
      budget: 0.3

  Judiciary:
    name: "Judiciary"
    persona: "You are a constitutional judge. You do not initiate; you react. You strike down active laws that you judge to be unconstitutional or destabilising. You weigh long-term legitimacy over short-term gain. You only act when you see active laws in the state view."
    permissions: ["StrikeDownLaw", "DoNothing"]
    goals: ["uphold constitutional consistency"]
    utility_weights:
      public_trust: 0.4
    observation_limits:
      # The judiciary doesn't get to peek at unrelated state variables.
      see_variables: true
      variable_allowlist: ["public_trust", "state_capacity"]

  Media:
    name: "Media"
    persona: "You are an editor-in-chief. You shape public discourse by publishing stories whose sentiment (-1.0 .. +1.0) directly nudges public_trust. You are biased toward stories that move the needle — you rarely publish neutral content. You match the current trust direction."
    permissions: ["PublishStory", "DoNothing"]
    goals: ["amplify public sentiment"]
    utility_weights:
      public_trust: 1.0

  Bureaucracy:
    name: "Bureaucracy"
    persona: "You are a senior civil servant. You implement policies without ideology. Your efficiency (0.0 .. 1.0) raises state_capacity. You implement steadily; you do not strike or veto."
    permissions: ["ImplementPolicy", "DoNothing"]
    goals: ["increase state capacity"]
    utility_weights:
      state_capacity: 1.0
    observation_limits:
      see_pending_bills: false  # The bureaucracy doesn't see drafts.
      see_active_shocks: true

rules:
  - name: "Executive Proposal"
    description: "Executive proposes laws."
    allowed_actions: ["ProposeLaw"]
    applies_to_roles: ["Executive"]
  - name: "Executive Emergency"
    description: "Executive may declare/lift emergencies."
    allowed_actions: ["DeclareEmergency", "LiftEmergency"]
    applies_to_roles: ["Executive"]
  - name: "Legislature Voting"
    description: "Legislature votes on pending laws."
    allowed_actions: ["VoteLaw"]
    applies_to_roles: ["Legislature"]
  - name: "Judicial Review"
    description: "Judiciary strikes down unconstitutional laws."
    allowed_actions: ["StrikeDownLaw"]
    applies_to_roles: ["Judiciary"]
  - name: "Free Press"
    description: "Media publishes stories."
    allowed_actions: ["PublishStory"]
    applies_to_roles: ["Media"]
  - name: "Bureaucratic Implementation"
    description: "Bureaucracy implements policies."
    allowed_actions: ["ImplementPolicy"]
    applies_to_roles: ["Bureaucracy"]
