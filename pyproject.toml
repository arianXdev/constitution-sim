[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "constitution-sim"
version = "0.1.0"
description = "A research-grade, reproducible, modular multi-agent simulator for stress-testing constitutions."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "PyYAML>=6.0",
    "pandas>=2.0.0",
    "matplotlib>=3.0.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.39.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
constitution-sim = "constitution_sim.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
